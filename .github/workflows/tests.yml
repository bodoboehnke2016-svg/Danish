name: Tests

# Deployment übernimmt GitHub Pages direkt aus dem Branch („Deploy from a branch“).
# Dieser Workflow prüft bei jedem Push die Quiz-Logik und die Vollständigkeit der Übersetzungen.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
